name: SymSentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Package & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Pre-Registered Hypothesis Unit Tests (13/13 Passing)
      run: |
        python -m pytest -v tests/

    - name: Verify CLI Functionality & Packaging
      run: |
        python -m symsentinel.cli --help
        python -m symsentinel.cli simulate --regime D1 --epochs 5 --shots 512
        python -m symsentinel.cli bundle

